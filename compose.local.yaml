services:
  gateway:
    image: nginx:1.28-alpine
    restart: unless-stopped
    ports:
      - '127.0.0.1:4173:80'
    volumes:
      - ./.runtime-config/domain.conf:/etc/nginx/conf.d/default.conf:ro
    mem_limit: 64m
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1/auth/sign-in"]
      interval: 30s
      timeout: 10s
      retries: 3
  ui:
    image: nuvio-next-ui:local
    restart: unless-stopped
    ports:
      - '127.0.0.1:4181:3000'
    environment:
      ORIGIN: https://tv.shloksheth.tech
      NUVIO_SCRAPER_ORIGIN: http://scraper-bridge:3000
    volumes:
      - next-data:/app/data
    mem_limit: 512m
  scraper-bridge:
    build: ./deployment/scraper-bridge
    image: nuvio-scraper-bridge:local
    restart: unless-stopped
    env_file: ../NuvioScraperBridge/.env
    mem_limit: 768m
    init: true
volumes:
  next-data:
